name: Backend tests

on:
  push:
    branches: [main, notes-round2]
  pull_request:

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every file parses
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
      - run: npm run test:unit
      - run: npm run bench:route

  flows:
    # Full flow and concurrency tests against a throwaway MongoDB started for this run
    # (no Atlas, no secrets). It is a single server, so the code's no-transaction path is what runs here.
    name: Flow and concurrency tests (test database)
    runs-on: ubuntu-latest
    needs: unit
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017/crowdgrid_test
      MONGO_URI: mongodb://localhost:27017/crowdgrid_test
      SEED_PASSWORD: CiOnlyDemoPass1
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      QR_SECRET: ci-only-qr-secret-not-used-anywhere-else
      PASS_TIME_WINDOWS: relaxed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed:test
      - run: npm run test:flows
      - run: npm run test:concurrency
