name: Backend tests

on:
  push:
    branches: [main, notes-round2]
  pull_request:

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every file parses
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
      - run: npm run test:unit
      - run: npm run bench:route

  flows:
    # Runs only when the repository has a TEST_MONGO_URI secret (a database ending in _test).
    # Atlas: allow access from anywhere (0.0.0.0/0) for that test cluster, or this job cannot connect.
    name: Flow and concurrency tests (test database)
    runs-on: ubuntu-latest
    needs: unit
    env:
      TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      QR_SECRET: ci-only-qr-secret-not-used-anywhere-else
      PASS_TIME_WINDOWS: relaxed
    steps:
      - uses: actions/checkout@v4
        if: env.TEST_MONGO_URI != ''
      - uses: actions/setup-node@v4
        if: env.TEST_MONGO_URI != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.TEST_MONGO_URI != ''
      - run: npm run seed:test
        if: env.TEST_MONGO_URI != ''
      - run: npm run test:flows
        if: env.TEST_MONGO_URI != ''
      - run: npm run test:concurrency
        if: env.TEST_MONGO_URI != ''
      - name: No test database configured
        if: env.TEST_MONGO_URI == ''
        run: echo "Add a TEST_MONGO_URI secret (database ending in _test) and SEED_PASSWORD to run the flow tests here."
